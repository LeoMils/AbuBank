name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to build'
        required: true
        default: 'feat/calendar-revolution'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref }}

      - name: Diagnostics
        run: |
          echo "ref: ${{ github.event.inputs.target_ref }}"
          git log -1 --oneline
          grep capacitor package.json || echo "no capacitor in package.json"
          test -d android && echo "android/ exists" || echo "android/ MISSING"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abubank-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
