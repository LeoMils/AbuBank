<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" role="img" aria-label="Abu — a warm illustrated grandmother, still frame">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#141a38"/><stop offset="55%" stop-color="#0a0f26"/><stop offset="100%" stop-color="#05081a"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#E8B563" stop-opacity="0.34"/><stop offset="55%" stop-color="#E8B563" stop-opacity="0.10"/><stop offset="100%" stop-color="#E8B563" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin2" x1="30%" y1="20%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#F5D2B3"/><stop offset="55%" stop-color="#E6B492"/><stop offset="100%" stop-color="#C98F6E"/>
    </linearGradient>
    <linearGradient id="hair2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FBFAF7"/><stop offset="45%" stop-color="#D8DCE4"/><stop offset="100%" stop-color="#B4BAC6"/>
    </linearGradient>
    <linearGradient id="shawl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A87C"/><stop offset="50%" stop-color="#D07A5A"/><stop offset="100%" stop-color="#9E4E3E"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8917A" stop-opacity="0.55"/><stop offset="100%" stop-color="#E8917A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE7B8" stop-opacity="0.85"/><stop offset="100%" stop-color="#FFE7B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Night-Garden ground + a few soft stars + warm aura behind her -->
  <rect width="360" height="400" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <circle cx="54" cy="70" r="1.1" opacity="0.6"/><circle cx="300" cy="58" r="1.4" opacity="0.7"/>
    <circle cx="330" cy="150" r="1" opacity="0.5"/><circle cx="36" cy="180" r="1" opacity="0.5"/>
    <circle cx="316" cy="250" r="1.1" opacity="0.45"/><circle cx="44" cy="300" r="1.2" opacity="0.45"/>
  </g>
  <ellipse cx="180" cy="168" rx="150" ry="160" fill="url(#aura)"/>

  <!-- Shoulders / shawl -->
  <path d="M70 400 Q78 300 130 276 Q160 264 180 264 Q200 264 230 276 Q282 300 290 400 Z" fill="url(#shawl)"/>
  <path d="M132 300 Q180 288 228 300" fill="none" stroke="#7E3A2E" stroke-width="2" opacity="0.5"/>
  <path d="M120 340 Q180 322 240 340" fill="none" stroke="#F3C39E" stroke-width="2" opacity="0.4"/>

  <!-- Neck -->
  <path d="M156 262 Q158 288 180 292 Q202 288 204 262 L204 244 L156 244 Z" fill="url(#skin2)"/>
  <path d="M156 258 Q180 274 204 258" fill="none" stroke="#B57F60" stroke-width="1.5" opacity="0.35"/>

  <!-- Hair behind -->
  <path d="M108 150 Q104 92 152 66 Q180 52 208 66 Q256 92 252 150 Q262 210 224 244 L136 244 Q98 210 108 150 Z" fill="url(#hair2)"/>
  <!-- soft bun, upper right -->
  <circle cx="238" cy="92" r="24" fill="url(#hair2)"/>

  <!-- Face -->
  <path d="M132 150 Q130 104 180 98 Q230 104 228 150 Q230 196 196 222 Q180 232 164 222 Q130 196 132 150 Z" fill="url(#skin2)"/>
  <!-- warm rim-light on the left edge (the "light" in silhouette & light) -->
  <path d="M132 150 Q130 104 180 98 Q168 108 160 150 Q156 196 178 222 Q170 226 164 222 Q130 196 132 150 Z" fill="url(#rim)" opacity="0.5"/>

  <!-- Hair framing the face -->
  <path d="M132 150 Q124 100 168 92 Q150 108 142 150 Q140 172 148 190 Q126 178 132 150 Z" fill="url(#hair2)"/>
  <path d="M228 150 Q236 100 196 90 Q214 108 220 150 Q222 172 214 190 Q234 178 228 150 Z" fill="url(#hair2)"/>

  <!-- Cheeks -->
  <ellipse cx="152" cy="176" rx="15" ry="11" fill="url(#cheek)"/>
  <ellipse cx="208" cy="176" rx="15" ry="11" fill="url(#cheek)"/>

  <!-- Brows — gentle -->
  <path d="M144 146 Q156 140 168 145" fill="none" stroke="#B9BEC9" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M192 145 Q204 140 216 146" fill="none" stroke="#B9BEC9" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Eyes — soft, kind, gently open with warmth (not detailed → dignified, never uncanny) -->
  <path d="M146 158 Q156 150 168 158 Q156 165 146 158 Z" fill="#FBEFE2"/>
  <path d="M192 158 Q204 150 214 158 Q204 165 192 158 Z" fill="#FBEFE2"/>
  <circle cx="157" cy="158" r="3.1" fill="#5A4636"/><circle cx="203" cy="158" r="3.1" fill="#5A4636"/>
  <circle cx="158.2" cy="156.8" r="0.9" fill="#FFFFFF"/><circle cx="204.2" cy="156.8" r="0.9" fill="#FFFFFF"/>
  <path d="M146 158 Q156 150 168 158" fill="none" stroke="#7A5B45" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M192 158 Q204 150 214 158" fill="none" stroke="#7A5B45" stroke-width="1.5" stroke-linecap="round"/>
  <!-- soft laugh lines -->
  <path d="M140 168 Q144 172 148 172" fill="none" stroke="#C79A78" stroke-width="1.2" opacity="0.6"/>
  <path d="M220 168 Q216 172 212 172" fill="none" stroke="#C79A78" stroke-width="1.2" opacity="0.6"/>

  <!-- Nose — a soft suggestion -->
  <path d="M180 162 Q176 178 174 186 Q180 190 186 186" fill="none" stroke="#C0906E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Mouth — a gentle, warm smile -->
  <path d="M164 200 Q180 212 196 200" fill="none" stroke="#B85C52" stroke-width="3" stroke-linecap="round"/>
  <path d="M167 201 Q180 208 193 201" fill="#E8917A" opacity="0.5"/>

  <!-- A small warm earring — a little celebratory -->
  <circle cx="140" cy="196" r="3" fill="#E8B563"/><circle cx="139" cy="195" r="1" fill="#FFF3D6"/>

  <!-- soft warm aura ring at the very base (grounding glow) -->
  <ellipse cx="180" cy="392" rx="150" ry="26" fill="#E8B563" opacity="0.05"/>
</svg>
