    <radialGradient id="Aaura" cx="50%" cy="40%" r="46%"><stop offset="0%" stop-color="#F0C070" stop-opacity="0.42"/><stop offset="55%" stop-color="#E8B563" stop-opacity="0.12"/><stop offset="100%" stop-color="#E8B563" stop-opacity="0"/></radialGradient>
    <radialGradient id="Askin" cx="42%" cy="34%" r="72%"><stop offset="0%" stop-color="#FBDDB8"/><stop offset="52%" stop-color="#EEBE94"/><stop offset="82%" stop-color="#D89A70"/><stop offset="100%" stop-color="#B87A54"/></radialGradient>
    <linearGradient id="Ahair" x1="18%" y1="0%" x2="82%" y2="100%"><stop offset="0%" stop-color="#FFFBF2"/><stop offset="40%" stop-color="#E9E4DA"/><stop offset="72%" stop-color="#CFC7BE"/><stop offset="100%" stop-color="#AFA79E"/></linearGradient>
