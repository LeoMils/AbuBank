notes: "בתו של אחיו של פפי (אחיינית של פפי). הגיעה לישראל לבד והתחתנה עם אוסקר; גרו בבת ים; רוסיטה לא אהבה לגור בישראל. שלושה בנים: ליאור, יואב, רון. אחרי כמה שנים היגרו ללוס אנג'לס; רוסיטה אוהבת לגור שם — לאו מתאר אותה כמרוצה במיוחד שיש לה כסף, ביטחון כלכלי ולא צריכה לעבוד. יש לה ולמרטיטה יחסים טובים — מדברות מדי פעם ונפגשות כשרוסיטה מבקרת בישראל; גם ללאו קשר מזדמן."
